<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirection...</title>
    <script>
        window.onload = function() {
            var isIPadOS = navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
            var userAgent = navigator.userAgent || navigator.vendor || window.opera;

            // 1. Détection des appareils Apple (iOS / iPadOS)
            if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                // REMPLACEZ PAR VOTRE LIEN APP STORE (APPLE)
                window.location.href = "https://apps.apple.com/us/app/to-six/id6755253538";
            }

            // 2. Détection des appareils Android
            else if (/android/i.test(userAgent)) {
                // REMPLACEZ PAR VOTRE LIEN GOOGLE PLAY STORE (ANDROID)
                window.location.href = "https://play.google.com/store/apps/details?id=ch.to_six.to_six";
            }

            // 3. Secours : Si l'utilisateur scanne avec un ordinateur ou un autre système
            else {
                // REMPLACEZ PAR VOTRE SITE WEB GÉNÉRAL OU UNE PAGE D'ACCUEIL
                window.location.href = "https://to-six-builder-ul9xbbg09yu0o0v9.hostingersite.com/";
            }
        };
    </script>
    <style>
        /* Un style simple et propre en attendant la redirection automatique */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f7;
            color: #1d1d1f;
        }
        .loader {
            text-align: center;
        }
        .stores {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 28px;
        }
        
        .btn {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 12px;
            background-color: #1d1d1f;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
        }
        
        .btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="loader">
        <h2>Redirection en cours...</h2>
        <p>Veuillez patienter un instant.</p>

        <div class="stores">
            <a class="btn" href="https://apps.apple.com/us/app/to-six/id6755253538">
                App Store
            </a>
            <a class="btn" href="https://play.google.com/store/apps/details?id=ch.to_six.to_six">
                Google Play
            </a>
        </div>
    </div>
</body>
</html>
